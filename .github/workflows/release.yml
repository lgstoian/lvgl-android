name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK and NDK
      run: |
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit, guard and plugin tests
      run: ./gradlew :lvgl-android:testDebugUnitTest :app:testDebugUnitTest :build-logic:test --no-daemon --stacktrace

    - name: Check public API compatibility
      run: ./gradlew :lvgl-android:apiCheck --no-daemon --stacktrace

    - name: Decode release keystore
      env:
        LVGL_KEYSTORE_BASE64: ${{ secrets.LVGL_KEYSTORE_BASE64 }}
      run: |
        test -n "$LVGL_KEYSTORE_BASE64" || { echo "Missing LVGL_KEYSTORE_BASE64 secret"; exit 1; }
        echo "$LVGL_KEYSTORE_BASE64" | base64 --decode > release.keystore
        ls -l release.keystore

    - name: Build release APKs and AAB
      env:
        LVGL_KEYSTORE: release.keystore
        LVGL_KEYSTORE_PASSWORD: ${{ secrets.LVGL_KEYSTORE_PASSWORD }}
        LVGL_KEY_ALIAS: ${{ secrets.LVGL_KEY_ALIAS }}
        LVGL_KEY_PASSWORD: ${{ secrets.LVGL_KEY_PASSWORD }}
      run: |
        ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace
        mkdir -p release-artifacts
        cp app/build/outputs/apk/release/*.apk release-artifacts/
        cp app/build/outputs/bundle/release/*.aab release-artifacts/

    - name: Generate checksums
      run: |
        cd release-artifacts
        sha256sum * > SHA256SUMS.txt
        cat SHA256SUMS.txt

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: release-artifacts/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
