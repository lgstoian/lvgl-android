name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    # Required to create a release and upload assets. The default token is
    # read-only in some repository configurations.
    permissions:
      contents: write
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      # No /dev/kvm on hosted runners: allow TCG software emulation. Without
      # this the emulator exits before adb ever sees the device.
      ANDROID_I_WANT_MY_TCG: "yes"

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK and NDK
      run: |
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit, guard and plugin tests
      run: ./gradlew :lvgl-android:testDebugUnitTest :app:testDebugUnitTest :build-logic:test --no-daemon --stacktrace

    - name: Check public API compatibility
      run: ./gradlew :lvgl-android:apiCheck --no-daemon --stacktrace

    - name: Decode release keystore
      env:
        LVGL_KEYSTORE_BASE64: ${{ secrets.LVGL_KEYSTORE_BASE64 }}
      run: |
        test -n "$LVGL_KEYSTORE_BASE64" || { echo "Missing LVGL_KEYSTORE_BASE64 secret"; exit 1; }
        echo "$LVGL_KEYSTORE_BASE64" | base64 --decode > release.keystore
        ls -l release.keystore

    - name: Build release APKs and AAB
      env:
        LVGL_KEYSTORE: release.keystore
        LVGL_KEYSTORE_PASSWORD: ${{ secrets.LVGL_KEYSTORE_PASSWORD }}
        LVGL_KEY_ALIAS: ${{ secrets.LVGL_KEY_ALIAS }}
        LVGL_KEY_PASSWORD: ${{ secrets.LVGL_KEY_PASSWORD }}
      run: |
        ./gradlew assembleRelease --no-daemon --stacktrace
        # Build the AAB in a separate command with ABI splits disabled.
        # AGP 8.10.1 fails bundleRelease when ABI splits and R8 resource
        # shrinking are combined (":app:buildReleasePreBundle":
        # "Sequence contains more than one matching element" — it expects one
        # shrunk .ap_ but finds three). Keep -Plvgl.bundleNoSplits=true; do NOT
        # fold this back into assembleRelease or drop the property.
        ./gradlew bundleRelease -Plvgl.bundleNoSplits=true --no-daemon --stacktrace
        mkdir -p release-artifacts
        cp app/build/outputs/apk/release/*.apk release-artifacts/
        cp app/build/outputs/bundle/release/*.aab release-artifacts/
        test -s release-artifacts/app-universal-release.apk || { echo "Missing universal release APK"; exit 1; }
        ls -l release-artifacts/

    - name: Upload universal APK for fallback smoke
      uses: actions/upload-artifact@v4
      with:
        # Only consumed by smoke-fallback below; publishing still happens in
        # this job and only after the required target-level smoke passes.
        name: smoke-apk
        path: release-artifacts/app-universal-release.apk
        if-no-files-found: error
        retention-days: 7

    - name: Release smoke (target API 36, blocks publishing on failure)
      # REQUIRED gate, same smoke path CI uses: install the universal release
      # APK and assert no app crash/ANR, LVGL init, the 4 showcase tiles and
      # clean layout lint. This is a hard gate with no error tolerance and no
      # unconditional-always clause: a failure skips the checksums and Create
      # Release steps below. tools/ci-dynamic.sh fails closed when the APK is
      # missing.
      uses: reactivecircus/android-emulator-runner@v2
      with:
        # Exercise the published targetSdk (36), not a lower compatibility
        # level. ubuntu-latest provides the android-36 google_apis x86_64 image
        # the runner installs via sdkmanager. Do NOT downgrade to 34 to make CI
        # green: if the image is unavailable this job fails loudly and the
        # smoke-fallback job reports a clearly non-equivalent API-34 smoke.
        api-level: 36
        arch: x86_64
        profile: pixel_5
        # The hosted runner has no /dev/kvm: an API 36 system image can take
        # well over the 10-minute default to boot under software emulation.
        emulator-boot-timeout: 1500
        script: SMOKE_ONLY=1 RELEASE_APK=release-artifacts/app-universal-release.apk sh tools/ci-dynamic.sh

    - name: Generate checksums
      run: |
        cd release-artifacts
        sha256sum * > SHA256SUMS.txt
        cat SHA256SUMS.txt

    - name: Extract release notes
      run: |
        mkdir -p release-artifacts
        # The 1.1.0 section of the changelog, without the heading.
        awk '/^## \[1\.1\.0\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md \
          | sed 's/^### //' > release-artifacts/RELEASE_NOTES.md
        head -20 release-artifacts/RELEASE_NOTES.md

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: release-artifacts/*
        body_path: release-artifacts/RELEASE_NOTES.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Fallback for when the target-level smoke cannot run — e.g. no API 36 system
  # image on ubuntu-latest. It repeats only the release smoke on API 34 for
  # diagnostic coverage. This is NOT equivalent to target-level verification:
  # the failed `build` job still fails the workflow, and publishing happens only
  # after the API 36 smoke passes, so this job can never publish or mask the
  # required gate.
  smoke-fallback:
    runs-on: ubuntu-latest
    needs: build
    if: failure()
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_I_WANT_MY_TCG: "yes"
      RELEASE_APK: smoke-apk/app-universal-release.apk
    steps:
    - uses: actions/checkout@v4
      with: { submodules: recursive }
    - uses: actions/setup-java@v4
      with: { java-version: '17', distribution: 'temurin' }
    - name: Setup SDK + NDK
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"
    - name: Download release APK
      uses: actions/download-artifact@v4
      with:
        name: smoke-apk
        path: smoke-apk
    - name: API 34 fallback smoke (diagnostic only, NOT a publishing gate)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        profile: pixel_5
        emulator-boot-timeout: 1500
        script: SMOKE_ONLY=1 sh tools/ci-dynamic.sh
