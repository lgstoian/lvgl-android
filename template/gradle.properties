# Gradle build root that contains the :lvgl-android module.
# Default ".." assumes this template lives inside the framework repository
# (template/ and lvgl-android/ are siblings). Point it at the framework
# repository root if you copy the template elsewhere.
lvglAndroidPath=..

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
